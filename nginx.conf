# Padanan public/.htaccess untuk nginx (dipakai Dockerfile).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Redirect /kebun ke /kebun/ tetap relatif, aman di belakang proxy HTTPS Dokploy.
  absolute_redirect off;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

  error_page 404 /404.html;

  location / {
    try_files $uri $uri/ $uri.html =404;
    add_header Cache-Control "no-cache";
  }
  # File di _next/static punya hash di namanya, aman disimpan lama.
  location ^~ /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location ~* \.(webp|png|svg|woff2)$ {
    add_header Cache-Control "public, max-age=2592000";
  }
  # Jangan sajikan file tersembunyi seperti .htaccess.
  location ~ /\. {
    deny all;
  }
}
